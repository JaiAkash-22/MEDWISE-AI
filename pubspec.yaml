name: medwise_ai
description: "MedWise AI — Scan. Understand. Stay Safe."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera + OCR
  camera: ^0.12.0+2
  google_mlkit_text_recognition: ^0.13.0

  # AI explanation (calling an LLM API)
  http: ^1.2.2

  # Local storage (history, profiles, reminders) — simplest option for a hackathon
  shared_preferences: ^2.3.2

  # Voice read-aloud
  flutter_tts: ^4.1.0

  # Emergency QR card
  qr_flutter: ^4.1.0

  # Reminders
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  timezone: ^0.9.4

  # Nice icons
  cupertino_icons: ^1.0.8

  # Fonts for app theme
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
